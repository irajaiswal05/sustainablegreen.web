<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sustainable green | Under Construction</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #F8FAFC;
            color: #1E293B;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.08);
            border-top: 6px solid #10B981;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin: 20px 0 10px;
            font-weight: 700;
        }
        p {
            font-size: 16px;
            color: #64748B;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #E2E8F0;
            border-top: 4px solid #10B981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>This Site is Under Construction</h1>
        <p>Check back soon for interactive data and eco-insights.</p>
    </div>
</body>
</html>
